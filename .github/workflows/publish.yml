name: Publish NuGet

# ─── Triggers ─────────────────────────────────────────────────────────────────
# 1. Automatic: Triggered by Release Please when a release PR is merged.
#    The workflow_dispatch input 'version' will be set to the new SemVer.
# 2. Manual: Also triggered by pushing a 'v*.*.*' tag manually (legacy support).
# 3. Manual dispatch: Via GitHub UI for debugging.
#
# Automatic versioning flow:
#   Commit with Conventional prefix (e.g. 'feat:') →
#   release-please.yml creates/updates Release PR →
#   Maintainer merges Release PR →
#   release-please creates GitHub Release + tag vX.Y.Z →
#   release-please triggers this workflow via workflow_dispatch →
#   Pack → Sign → Attest → Publish to NuGet.org
# ─────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*.*.*"           # Legacy: manual tag push still works
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.2.3 — without 'v' prefix)"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ─── Job 1: Verify Stryker Mutation Quality Gate on main ────────────────────
  mutation-gate-check:
    name: Verify Mutation Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
      actions: read
    outputs:
      needs_stryker: ${{ steps.check.outputs.needs_stryker }}
      can_proceed: ${{ steps.check.outputs.can_proceed }}
      evaluated_commit: ${{ steps.check.outputs.evaluated_commit }}
      mutation_score: ${{ steps.check.outputs.mutation_score }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Evaluate Mutation Quality Gate on main
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const verifyMutationGate = require('./scripts/verify-mutation-gate.js');
            await verifyMutationGate({ github, context, core });

  # ─── Job 2: Conditional Stryker Execution if needed ────────────────────────
  stryker-gate:
    name: Run Stryker Mutation Gate (Conditional)
    needs: mutation-gate-check
    if: needs.mutation-gate-check.outputs.needs_stryker == 'true'
    permissions:
      contents: write
      statuses: write
      actions: read
    uses: ./.github/workflows/mutation-testing.yml
    with:
      mutation-level: "Standard"
    secrets: inherit

  # ─── Job 3: Publish to NuGet (Strict Quality Gate Required) ────────────────
  publish:
    name: Pack & Publish
    needs: [mutation-gate-check, stryker-gate]
    if: |
      always() &&
      (needs.mutation-gate-check.result == 'success') &&
      (
        (needs.mutation-gate-check.outputs.needs_stryker == 'false' && needs.mutation-gate-check.outputs.can_proceed == 'true') ||
        (needs.mutation-gate-check.outputs.needs_stryker == 'true' && needs.stryker-gate.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Required for Sigstore OIDC attestation
      contents: write        # Required for GitHub Release creation
      attestations: write    # Required for actions/attest-build-provenance
      statuses: read         # Required to query commit statuses for Stryker quality gate
      actions: read          # Required to query workflow runs for Stryker quality gate

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Full history required for MinVer and Release Please commit analysis
          fetch-depth: 0

      # ─── Resolve version ──────────────────────────────────────────────────────
      # Priority: workflow_dispatch input → git tag → fallback to Directory.Build.props
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            # Triggered by Release Please via workflow_dispatch
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from workflow_dispatch input: $INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Triggered by a git tag push (strip 'v' prefix)
            VERSION="${GITHUB_REF_NAME#v}"
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from git tag: $VERSION"
          else
            # Fallback: read from Directory.Build.props
            VERSION=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props || echo "1.0.0")
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Resolved version from Directory.Build.props: $VERSION"
          fi


      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      # ─── Strong Name key ──────────────────────────────────────────────────────
      # The private .snk is stored as a base64-encoded GitHub Secret (SNK_KEY).
      # The public key is committed as public.snk. If SNK_KEY is not set (e.g.,
      # in a fork), the build succeeds without signing (conditional in Directory.Build.props).
      - name: Restore Strong Name key
        env:
          SNK_KEY: ${{ secrets.SNK_KEY }}
        run: |
          if [ -n "$SNK_KEY" ]; then
            echo "$SNK_KEY" | tr -d '\n\r ' | base64 --decode > EricksonLopez.snk
            echo "Strong Name key restored from secret."
          else
            echo "SNK_KEY secret not set — building without strong name signing."
          fi

      - name: Restore
        run: dotnet restore EricksonLopez.ValueObjects.slnx

      - name: Build (Release)
        run: dotnet build EricksonLopez.ValueObjects.slnx --no-restore --configuration Release

      # ─── Full test suite before publish ──────────────────────────────────────
      # Never publish without a passing test suite.
      - name: Run tests before publish
        run: |
          dotnet test EricksonLopez.ValueObjects.slnx \
            --no-build \
            --configuration Release \
            --results-directory ./test-results \
            --report-xunit-trx \
            --coverlet \
            --coverlet-output-format opencover

      - name: Upload coverage to Codecov (publish gate)
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "**/coverage.opencover.*.xml,**/coverage.opencover.xml"
          fail_ci_if_error: false
          flags: publish-gate
          name: codecov-publish

      # ─── Pack all packages ────────────────────────────────────────────────────
      - name: Pack All Packages
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PACK_ARGS="--no-build --configuration Release --output ./nupkgs -p:VersionPrefix=$VERSION -p:TreatWarningsAsErrors=true"
          dotnet pack src/EricksonLopez.ValueObjects/EricksonLopez.ValueObjects.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Fiscal.DominicanRepublic/EricksonLopez.ValueObjects.Fiscal.DominicanRepublic.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Fiscal.Chile/EricksonLopez.ValueObjects.Fiscal.Chile.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Fiscal.Colombia/EricksonLopez.ValueObjects.Fiscal.Colombia.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Fiscal.Mexico/EricksonLopez.ValueObjects.Fiscal.Mexico.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Fiscal.Peru/EricksonLopez.ValueObjects.Fiscal.Peru.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Fiscal.Argentina/EricksonLopez.ValueObjects.Fiscal.Argentina.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.EntityFrameworkCore/EricksonLopez.ValueObjects.EntityFrameworkCore.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Dapper/EricksonLopez.ValueObjects.Dapper.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Serialization.Json/EricksonLopez.ValueObjects.Serialization.Json.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.DomainPrimitives/EricksonLopez.ValueObjects.DomainPrimitives.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Analyzers/EricksonLopez.ValueObjects.Analyzers.csproj $PACK_ARGS
          dotnet pack src/EricksonLopez.ValueObjects.Generators/EricksonLopez.ValueObjects.Generators.csproj $PACK_ARGS
          echo "Packed packages:"
          ls -la ./nupkgs/

      # ─── Sigstore Provenance Attestation ─────────────────────────────────────
      # Generates a cryptographically signed provenance attestation for every .nupkg
      # using Sigstore's keyless signing via GitHub's OIDC token.
      - name: Generate Sigstore Provenance Attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: './nupkgs/*.nupkg'

      # ─── NuGet.org publish via OIDC ──────────────────────────────────────────
      # Uses NuGet Trusted Publishing (OIDC) — no long-lived API keys stored.
      - name: NuGet login (OIDC)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ericksonlopezf

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # ─── GitHub Release ───────────────────────────────────────────────────────
      - name: Create GitHub Release (tag-triggered only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          generate_release_notes: false
          body: |
            ## Ecosystem Packages in this release

            | Package | Version |
            |---------|---------|
            | `EricksonLopez.ValueObjects` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Fiscal.DominicanRepublic` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Fiscal.Chile` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Fiscal.Colombia` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Fiscal.Mexico` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Fiscal.Peru` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Fiscal.Argentina` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.EntityFrameworkCore` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Dapper` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Serialization.Json` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.DomainPrimitives` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Analyzers` | `${{ steps.version.outputs.VERSION }}` |
            | `EricksonLopez.ValueObjects.Generators` | `${{ steps.version.outputs.VERSION }}` |

            ---

            For detailed changes, see [CHANGELOG.md](https://github.com/ericksonlopezf/dotnet-value-objects/blob/${{ github.ref_name }}/CHANGELOG.md).
          files: ./nupkgs/*.nupkg
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
